version: 2
updates:
- package-ecosystem: npm
  schedule:
    interval: monthly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  allow:
  - dependency-name: '*'
    update-types:
    - version-update:semver-patch
    - version-update:semver-minor
  groups:
    maintenance:
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
  directories:
  - /
  - /landing
- package-ecosystem: docker
  directory: /docker
  schedule:
    interval: monthly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  groups:
    images:
      patterns:
      - '*'
  ignore:
  - dependency-name: node
    versions:
    - '>=23'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: quarterly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  groups:
    actions:
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
