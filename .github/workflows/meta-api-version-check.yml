name: Meta API Version Check

on:
  schedule:
    # Every Monday at 9:00 UTC. Scheduled runs detect changes and open a review issue only.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      confirm_live_probe:
        description: "Run the strict live probe against the dedicated Meta test assets (may publish/delete a test post and send a test DM)."
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-version:
    name: Check for new Meta Graph API version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect current version and find the next available version
        id: version
        run: |
          CURRENT=$(grep '^export const META_API_VERSION' src/lib/platforms/constants.ts | grep -oP 'v\d+\.\d+')
          CURRENT_MAJOR=$(echo "$CURRENT" | grep -oP '\d+' | head -1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # A version only counts as available when Meta accepts its root endpoint. Network and
          # unexpected API errors fail the job rather than being mistaken for a newer version.
          LATEST_MAJOR=$CURRENT_MAJOR
          CHECK=$((CURRENT_MAJOR + 1))
          while [ "$CHECK" -le $((CURRENT_MAJOR + 20)) ]; do
            RESPONSE=$(curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sS "https://graph.facebook.com/v${CHECK}.0/" || true)
            if echo "$RESPONSE" | grep -q "does not exist"; then
              break
            fi
            if ! echo "$RESPONSE" | grep -q '"error"'; then
              echo "Could not determine whether v${CHECK}.0 exists" >&2
              exit 1
            fi
            LATEST_MAJOR=$CHECK
            CHECK=$((CHECK + 1))
          done

          LATEST="v${LATEST_MAJOR}.0"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Already on latest version ($CURRENT)"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "New version available: $CURRENT → $LATEST"
          fi

      - name: Decide whether strict validation was explicitly requested
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.confirm_live_probe }}" = "true" ]; then
            echo "strict=true" >> "$GITHUB_OUTPUT"
          else
            echo "strict=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if a review item already exists
        if: steps.version.outputs.exists == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT="${{ steps.version.outputs.latest }}"
          PR_COUNT=$(gh pr list --search "Meta API $NEXT" --state open --json number --jq 'length')
          ISSUE_NUMBER=$(gh issue list --search "Meta API $NEXT" --state open --json number --jq '.[0].number // empty')
          ISSUE_COUNT=0
          if [ -n "$ISSUE_NUMBER" ]; then ISSUE_COUNT=1; fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          if [ "$PR_COUNT" -gt 0 ] || { [ "$ISSUE_COUNT" -gt 0 ] && [ "${{ steps.mode.outputs.strict }}" != "true" ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review issue for a detected version
        if: steps.version.outputs.exists == 'true' && steps.existing.outputs.skip != 'true' && steps.mode.outputs.strict != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ steps.version.outputs.current }}"
          NEXT="${{ steps.version.outputs.latest }}"
          gh issue create \
            --title "Meta Graph API ${NEXT} available — strict validation required" \
            --label "dependencies" \
            --body "$(cat <<EOF
          Meta Graph API ${NEXT} is available; PostStack remains on ${CURRENT}.

          No version-bump PR was created. Run **Meta API Version Check** manually with
          confirm_live_probe=true after configuring the dedicated test-asset secrets documented
          in README. That run requires every read and write probe to pass before it can create a PR.
          EOF
          )"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.version.outputs.exists == 'true' && steps.existing.outputs.skip != 'true' && steps.mode.outputs.strict == 'true'
        with:
          node-version: "22.x"
          cache: "npm"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.version.outputs.exists == 'true' && steps.existing.outputs.skip != 'true' && steps.mode.outputs.strict == 'true'
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        if: steps.version.outputs.exists == 'true' && steps.existing.outputs.skip != 'true' && steps.mode.outputs.strict == 'true'
        run: npm ci

      - name: Bump the candidate version
        if: steps.version.outputs.exists == 'true' && steps.existing.outputs.skip != 'true' && steps.mode.outputs.strict == 'true'
        run: |
          sed -i "s|${{ steps.version.outputs.current }}|${{ steps.version.outputs.latest }}|g" src/lib/platforms/constants.ts

      - name: Run lint
        if: steps.version.outputs.exists == 'true' && steps.existing.outputs.skip != 'true' && steps.mode.outputs.strict == 'true'
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Run typecheck
        if: steps.version.outputs.exists == 'true' && steps.existing.outputs.skip != 'true' && steps.mode.outputs.strict == 'true'
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Run contract and unit tests
        if: steps.version.outputs.exists == 'true' && steps.existing.outputs.skip != 'true' && steps.mode.outputs.strict == 'true'
        id: test
        continue-on-error: true
        run: npm test

      - name: Probe every live Meta API surface used by PostStack
        if: steps.version.outputs.exists == 'true' && steps.existing.outputs.skip != 'true' && steps.mode.outputs.strict == 'true'
        id: probe
        continue-on-error: true
        env:
          META_APP_ID: ${{ secrets.META_PROBE_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_PROBE_APP_SECRET }}
          META_PROBE_PAGE_TOKEN: ${{ secrets.META_PROBE_PAGE_TOKEN }}
          META_PROBE_PAGE_ID: ${{ secrets.META_PROBE_PAGE_ID }}
          META_PROBE_IG_ID: ${{ secrets.META_PROBE_IG_ID }}
          META_PROBE_IG_TOKEN: ${{ secrets.META_PROBE_IG_TOKEN }}
          META_PROBE_IG_USER_ID: ${{ secrets.META_PROBE_IG_USER_ID }}
          META_PROBE_PSID: ${{ secrets.META_PROBE_PSID }}
          META_PROBE_VERSION: ${{ steps.version.outputs.latest }}
          META_PROBE_STRICT: "1"
          META_PROBE_WRITE: "1"
        run: bun scripts/meta-version-probe.ts

      - name: Determine strict validation outcome
        if: steps.version.outputs.exists == 'true' && steps.existing.outputs.skip != 'true' && steps.mode.outputs.strict == 'true'
        id: outcome
        run: |
          if [ "${{ steps.lint.outcome }}" = "success" ] && \
             [ "${{ steps.typecheck.outcome }}" = "success" ] && \
             [ "${{ steps.test.outcome }}" = "success" ] && \
             [ "${{ steps.probe.outcome }}" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=review-needed" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a validated version-bump PR
        if: steps.outcome.outputs.result == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ steps.version.outputs.current }}"
          NEXT="${{ steps.version.outputs.latest }}"
          ISSUE_NUMBER="${{ steps.existing.outputs.issue_number }}"
          LINKED_ISSUE=""
          if [ -n "$ISSUE_NUMBER" ]; then LINKED_ISSUE="Closes #$ISSUE_NUMBER"; fi
          BRANCH="chore/meta-api-${NEXT}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/lib/platforms/constants.ts
          git commit -m "chore: validate Meta Graph API ${CURRENT} to ${NEXT}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: validate Meta Graph API ${CURRENT} → ${NEXT}" \
            --body "$(cat <<EOF
          ## Validated Meta Graph API version bump: ${CURRENT} → ${NEXT}

          This candidate passed lint, typecheck, contract/unit tests, and the strict live probe
          against the dedicated Meta test assets, including the opt-in write and cleanup cycle.

           Manual release review still requires checking the provider changelog and the assisted
           inbound-webhook flow; do not merge solely because this PR exists.

           ${LINKED_ISSUE}
           EOF
           )"

      - name: Open issue when strict validation does not pass
        if: steps.outcome.outputs.result == 'review-needed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ steps.version.outputs.current }}"
          NEXT="${{ steps.version.outputs.latest }}"
          ISSUE_NUMBER="${{ steps.existing.outputs.issue_number }}"
          BODY="$(cat <<EOF
           Strict validation for Meta Graph API ${CURRENT} → ${NEXT} did not pass. No PR was created.

           Outcomes: lint=${{ steps.lint.outcome }}, typecheck=${{ steps.typecheck.outcome }}, tests=${{ steps.test.outcome }}, live-probe=${{ steps.probe.outcome }}.

           Check that all META_PROBE_* repository secrets refer to the dedicated test assets,
           inspect the redacted workflow logs, then re-run the manually dispatched workflow.
           EOF
           )"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create \
              --title "Meta Graph API ${NEXT} available — strict validation failed" \
              --label "dependencies" \
              --body "$BODY"
          fi
