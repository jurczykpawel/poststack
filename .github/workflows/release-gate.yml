name: Release gate

# Refuses a release while pull requests, issues or security alerts are open in the repository.
# Repository-agnostic: called from release.yml today, meant to move 1:1 into a shared repository.
# The caller grants the permissions below. Only GITHUB_TOKEN is used: secret scanning alerts and draft
# security advisories are out of its reach and are checked locally at cycle start (see scripts/release/open-items-gate.sh).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  open-items:
    name: Nothing left open
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      security-events: read
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/release
      - name: Check open pull requests, issues and security alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/open-items-gate.sh release
