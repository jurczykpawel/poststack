name: Security - Secret Scan

on:
  push:
  pull_request:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        # Run the scanner image itself by digest. Pinning only the composite action is insufficient:
        # its default scanner image tag is mutable.
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/trufflesecurity/trufflehog@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577
          git file:///repo --fail --no-update --only-verified
